name: Deploy to Vultr

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger manually from GitHub UI

jobs:
  build-and-deploy:
    name: Build → Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node setup with npm cache ──────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 4. Build (inject env vars from GitHub Secrets) ────────
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 5. Copy dist/ to Vultr via rsync over SSH ─────────────
      - name: Upload dist to Vultr
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_KEY }}
          ARGS:            "-rlgoDzvc --delete"
          SOURCE:          "dist/"
          REMOTE_HOST:     ${{ secrets.VULTR_HOST }}
          REMOTE_USER:     ${{ secrets.VULTR_USER }}
          TARGET:          /var/www/ue-portal/
          EXCLUDE:         "/.git/, /.github/"

      # ── 6. Reload Nginx so it picks up the new files ──────────
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key:      ${{ secrets.VULTR_SSH_KEY }}
          script:   sudo systemctl reload nginx

      # ── 7. Print the live URL ─────────────────────────────────
      - name: Done
        run: echo "✅ Deployed → http://${{ secrets.VULTR_HOST }}"
